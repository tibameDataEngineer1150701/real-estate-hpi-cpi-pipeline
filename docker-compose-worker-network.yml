
services:
  crawler_real-estate:  # 定義一個服務，名稱為 crawler_real-estate
    image: chingyun09/real-estate_crawler:0.0.2  # 使用的映像檔名稱與標籤（版本）
    hostname: "real-estate"  # 設定 hostname = real-estate
    command: uv run celery -A crawler.worker worker --loglevel=info --hostname=%h -Q real-estate  
    # 啟動容器後執行的命令，這裡是啟動 Celery worker，指定 app 為 crawler.worker，設定日誌等級為 info，
    # 使用主機名稱當作 worker 名稱（%h），並將此 worker 加入名為 "real-estate" 的任務佇列 (queue)

    restart: always  # 若容器停止或崩潰，自動重新啟動
    environment:
      - TZ=Asia/Taipei  # 設定時區為台北（UTC+8）
    networks:
      - my_network_real-estate  # 將此服務連接到 my_network_real-estate 網路

  crawler_hpi:  # 定義一個服務，名稱為 crawler_hpi
    image: chingyun09/real-estate_crawler:0.0.2  # 使用的映像檔名稱與標籤（版本）
    hostname: "hpi"  # 設定 hostname = hpi
    command: uv run celery -A crawler.worker worker --loglevel=info --hostname=%h -Q hpi  
    # 啟動容器後執行的命令，這裡是啟動 Celery worker，指定 app 為 crawler.worker，設定日誌等級為 info，
    # 使用主機名稱當作 worker 名稱（%h），並將此 worker 加入名為 "hpi" 的任務佇列 (queue)

    restart: always  # 若容器停止或崩潰，自動重新啟動
    environment:
      - TZ=Asia/Taipei  # 設定時區為台北（UTC+8）
    networks:
      - my_network_real-estate  # 將此服務連接到 my_network_real-estate 網路

  crawler_cpi:  # 定義一個服務，名稱為 crawler_cpi
    image: chingyun09/real-estate_crawler:0.0.2  # 使用的映像檔名稱與標籤（版本）
    hostname: "cpi"  # 設定 hostname = cpi
    command: uv run celery -A crawler.worker worker --loglevel=info --hostname=%h -Q cpi  
    # 啟動容器後執行的命令，這裡是啟動 Celery worker，指定 app 為 crawler.worker，設定日誌等級為 info，
    # 使用主機名稱當作 worker 名稱（%h），並將此 worker 加入名為 "cpi" 的任務佇列 (queue)

    restart: always  # 若容器停止或崩潰，自動重新啟動
    environment:
      - TZ=Asia/Taipei  # 設定時區為台北（UTC+8）
    networks:
      - my_network_real-estate  # 將此服務連接到 my_network_real-estate 網路

networks:
  my_network_real-estate:
    # 加入已經存在的網路
    external: true
